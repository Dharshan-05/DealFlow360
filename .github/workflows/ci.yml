name: DealFlow360 CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI & Regression (Python 3.11 + PostgreSQL 15)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: dealflow360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/dealflow360
      JWT_SECRET_KEY: dealflow360-ci-ephemeral-test-jwt-secret-key-min-32-chars-long-12345
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations (Alembic)
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Verify Database Master Seeding Idempotency
        working-directory: backend
        run: |
          python -m app.db.seed
          python -m app.db.seed

      - name: Run Full Backend Regression Suite (239 Tests)
        working-directory: backend
        run: |
          pytest tests -v --durations=10

      - name: Verify Production Configuration Fail-Safe Behavior
        working-directory: backend
        run: |
          python -c "
          import os
          from pydantic_core import ValidationError
          import app.core.config as cfg

          # 1. Insecure default secret in production must fail
          os.environ['ENVIRONMENT'] = 'production'
          os.environ['DEBUG'] = 'false'
          os.environ['JWT_SECRET_KEY'] = cfg.INSECURE_DEV_JWT_SECRET
          try:
              cfg.Settings()
              print('FAILED: Did not reject insecure secret in production')
              exit(1)
          except ValidationError:
              print('PASSED: Insecure secret rejected in production')

          # 2. DEBUG=true in production must fail
          os.environ['JWT_SECRET_KEY'] = 'valid-secret-with-more-than-32-characters-12345'
          os.environ['DEBUG'] = 'true'
          try:
              cfg.Settings()
              print('FAILED: Did not reject DEBUG=true in production')
              exit(1)
          except ValidationError:
              print('PASSED: DEBUG=true rejected in production')
          "

  frontend-ci:
    name: Frontend CI (Node.js 20 + TypeScript + Next.js Build)
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_V1_STR: /api/v1
      NODE_ENV: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Validation (typecheck)
        working-directory: frontend
        run: npm run typecheck

      - name: Next.js Production Build Validation
        working-directory: frontend
        run: npm run build

  devops-validation:
    name: DevOps & Deployment Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Validation Dependencies
        run: |
          python -m pip install pydantic python-dotenv

      - name: Validate Systemd Service Definitions
        run: |
          test -f deploy/systemd/dealflow360-backend.service
          test -f deploy/systemd/dealflow360-frontend.service
          grep -q "ExecStart=" deploy/systemd/dealflow360-backend.service
          grep -q "ExecStart=" deploy/systemd/dealflow360-frontend.service
          echo "Systemd service files validated."

      - name: Validate Nginx Configuration Syntax
        run: |
          test -f deploy/nginx/dealflow360.conf
          grep -q "proxy_pass" deploy/nginx/dealflow360.conf
          grep -q "upstream" deploy/nginx/dealflow360.conf
          echo "Nginx configuration syntax checked."

      - name: Run Production Readiness Audit Tool
        run: |
          python deploy/scripts/verify_production_readiness.py --ci-mode
